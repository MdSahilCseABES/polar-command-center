version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: polar_n8n_automation
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      # Set your Supabase credentials here or pass via .env file
      - SUPABASE_URL=${VITE_SUPABASE_URL:-https://your-project.supabase.co}
      - SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-your-supabase-anon-key}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./polar-command-center-workflow.json:/workflows/polar-command-center-workflow.json:ro

volumes:
  n8n_data:
