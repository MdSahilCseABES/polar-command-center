<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="polar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="ice-main" x1="50" y1="20" x2="35" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="ice-facet" x1="50" y1="20" x2="70" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="ring-glow" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="44" stroke="url(#ring-glow)" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.65" filter="url(#polar-glow)" />
  <circle cx="50" cy="50" r="40" stroke="#38BDF8" stroke-width="1.5" opacity="0.8" />
  <line x1="50" y1="3" x2="50" y2="9" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="91" x2="50" y2="97" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="3" y1="50" x2="9" y2="50" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="91" y1="50" x2="97" y2="50" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="19" cy="19" r="1.5" fill="#38BDF8" opacity="0.6" />
  <circle cx="81" cy="19" r="1.5" fill="#38BDF8" opacity="0.6" />
  <circle cx="19" cy="81" r="1.5" fill="#38BDF8" opacity="0.6" />
  <circle cx="81" cy="81" r="1.5" fill="#38BDF8" opacity="0.6" />
  <line x1="22" y1="72" x2="78" y2="72" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  <polygon points="50,22 25,70 50,68" fill="url(#ice-main)" opacity="0.95" />
  <polygon points="50,22 50,68 75,70" fill="url(#ice-facet)" opacity="0.85" />
  <polyline points="50,22 46,48 50,68" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
  <polygon points="35,70 48,52 56,70" fill="#38BDF8" opacity="0.35" />
  <circle cx="50" cy="14" r="2.5" fill="#FFFFFF" filter="url(#polar-glow)" />
</svg>
